<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e1e1e">
<title>Motoboy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tema ZipRotas */
  :root {
    --page: #1e1e1e; --card: #18181b; --line: #2e2e33; --text: #d6d6da; --title: #fafafa; --muted: #8a8a92;
    --red: #ea1d2c; --red-press: #c8101e; --red-deep: #7a141b; --red-soft: #ea1d2c1f;
    --green: #0a9c50; --green-lt: #2fca78; --green-soft: #0a9c5024; --amber: #f5a524; --amber-soft: #f5a52422;
    --radius: 12px; --tracking: -0.04em; --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); font-family: var(--font); font-weight: 500; padding: 20px 16px 32px; }
  .wrap { max-width: 420px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--red); display: grid; place-items: center; }
  .logo svg { width: 19px; height: 19px; }
  .brand b { color: var(--title); font-weight: 800; letter-spacing: -0.02em; font-size: 18px; }
  .brand .tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--red); background: var(--red-soft); padding: 4px 9px; border-radius: 999px; }
  .eyebrow { color: var(--red); font-weight: 700; font-size: 13px; margin: 0 0 8px; }
  h1 { font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: var(--tracking); color: var(--title); margin: 0 0 10px; }
  h1 mark { background: var(--red-deep); color: var(--title); padding: 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; line-height: 1.45; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; }
  input { width: 100%; padding: 15px 14px; font: inherit; font-size: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); color: var(--title); outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--red); }
  input::placeholder { color: #5c5c64; }
  button { width: 100%; padding: 17px; font: inherit; font-size: 16px; font-weight: 700; border-radius: var(--radius); border: 0; cursor: pointer; margin-top: 20px; transition: background .2s var(--ease), transform .1s; }
  button:active { transform: scale(.98); }
  .go { background: var(--red); color: #fff; box-shadow: 0 10px 30px #ea1d2c40; }
  .go:hover { background: var(--red-press); }
  .stop { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; margin-top: 14px; }
  .gps { display: flex; align-items: center; gap: 14px; }
  .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--green-lt); box-shadow: 0 0 0 0 #2fca7888; animation: p 1.6s infinite; flex: none; }
  .pulse.off { background: var(--red); animation: none; }
  @keyframes p { to { box-shadow: 0 0 0 14px #2fca7800; } }
  .gps b { color: var(--title); font-weight: 700; }
  .small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .status button { margin: 0; padding: 15px 6px; font-size: 14px; background: #232327; color: var(--text); border: 2px solid transparent; }
  .status button.on[data-s=disponivel] { border-color: var(--green); background: var(--green-soft); color: var(--green-lt); }
  .status button.on[data-s=entrega] { border-color: var(--red); background: var(--red-soft); color: #ff5a66; }
  .status button.on[data-s=pausa] { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
  .order { font-size: 30px; font-weight: 800; letter-spacing: var(--tracking); color: var(--title); margin-top: 4px; }
  .hidden { display: none; }
  .err { color: #ff5a66; font-size: 13px; margin-top: 10px; }
  .ok { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 14px; justify-content: center; }
  .ok svg { width: 14px; height: 14px; stroke: var(--green-lt); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg></div>
    <b>ZipRotas</b><span class="tag">Motoboy</span>
  </div>
  <p class="eyebrow">Turno de entregas</p>
  <h1><mark>A loja vê</mark> onde você está.</h1>
  <p class="sub">Ligue no começo do turno: a loja acompanha suas entregas e manda o próximo pedido direto aqui.</p>

  <div id="setup">
    <label>Seu nome</label>
    <input id="name" placeholder="Ex.: Carlos Silva" autocomplete="name">
    <label>Telefone (opcional)</label>
    <input id="phone" placeholder="(11) 99999-9999" inputmode="tel" autocomplete="tel">
    <button class="go" id="start">Iniciar turno →</button>
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Localização só é enviada durante o turno</div>
    <div class="err" id="err"></div>
  </div>

  <div id="running" class="hidden">
    <div class="card gps">
      <div class="pulse" id="pulse"></div>
      <div><b id="gpsText">Obtendo GPS…</b><div class="small" id="gpsMeta"></div></div>
    </div>
    <div class="card">
      <div class="small">Seu status</div>
      <div class="status">
        <button data-s="disponivel">Livre</button>
        <button data-s="entrega">Entregando</button>
        <button data-s="pausa">Pausa</button>
      </div>
      <div id="orderBox" class="hidden" style="margin-top:14px">
        <div class="small">Pedido atual</div>
        <div class="order" id="order"></div>
      </div>
    </div>
    <button class="stop" id="stop">Encerrar turno</button>
    <div class="err" id="err2"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let id = store.get('mb-id');
if (!id) { id = 'mb-' + Math.random().toString(36).slice(2, 10); store.set('mb-id', id); }
$('name').value = store.get('mb-name') || '';
$('phone').value = store.get('mb-phone') || '';

let watchId = null, status = 'disponivel', pendingStatus = null, last = null, lastSent = 0, wakeLock = null;

function setStatusUI() {
  document.querySelectorAll('.status button').forEach((b) => b.classList.toggle('on', b.dataset.s === status));
}

async function send(pos, force) {
  last = pos;
  const now = Date.now();
  if (!force && now - lastSent < 3000) return; // no máximo a cada 3s
  lastSent = now;
  const c = pos.coords;
  try {
    const r = await fetch('/api/location', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name: $('name').value.trim(), phone: $('phone').value.trim(), lat: c.latitude, lng: c.longitude, speed: c.speed || 0, heading: c.heading || 0, accuracy: Math.round(c.accuracy), status: pendingStatus || undefined }),
    });
    const j = await r.json();
    pendingStatus = null;
    status = j.status; setStatusUI();
    $('orderBox').classList.toggle('hidden', !j.order);
    $('order').textContent = j.order || '';
    $('gpsText').textContent = 'Enviando localização';
    $('pulse').classList.remove('off');
    $('err2').textContent = '';
  } catch {
    $('err2').textContent = 'Sem conexão com o servidor. Tentando de novo…';
    $('pulse').classList.add('off');
  }
  $('gpsMeta').textContent = `Precisão ±${Math.round(c.accuracy)} m · ${new Date().toLocaleTimeString('pt-BR')}`;
}

$('start').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { $('err').textContent = 'Digite seu nome.'; return; }
  if (!('geolocation' in navigator)) { $('err').textContent = 'Este aparelho não tem GPS disponível no navegador.'; return; }
  store.set('mb-name', name); store.set('mb-phone', $('phone').value.trim());
  $('setup').classList.add('hidden'); $('running').classList.remove('hidden');
  setStatusUI();
  watchId = navigator.geolocation.watchPosition((p) => send(p), (e) => {
    $('gpsText').textContent = 'GPS indisponível';
    $('pulse').classList.add('off');
    $('err2').textContent = e.code === 1 ? 'Permita o acesso à localização nas configurações do navegador.' : 'Erro de GPS: ' + e.message + (location.protocol !== 'https:' && location.hostname !== 'localhost' ? ' (o GPS exige HTTPS)' : '');
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  // reenvia a cada 10s mesmo parado, para não aparecer offline
  setInterval(() => last && send(last, true), 10000);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
};

document.querySelectorAll('.status button').forEach((b) => b.onclick = () => {
  status = pendingStatus = b.dataset.s; setStatusUI();
  if (last) send(last, true);
});

$('stop').onclick = () => {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  wakeLock?.release?.();
  location.reload();
};
</script>
</body>
</html>
